# 검색 대상 프로필 — 동명이인을 걸러내는 기준을 여기서 정합니다.
target:
  # KIPRIS(한글 특허) 검색에 쓰는 이름
  name_ko: "홍길동"
  # Google Scholar 검색에 쓰는 영문 이름
  name_en: "Gildong Hong"

  # 소속기관. 논문의 저자 소속 / 특허의 출원인·주소와 대조해 가점합니다.
  # 국문·영문 표기를 모두 넣어두면 매칭률이 올라갑니다.
  affiliations:
    - "Samsung Display"
    - "삼성디스플레이"
    - "Seoul National University"
    - "서울대학교"

  # 연구/기술 분야 키워드. 논문 제목·초록, 특허 제목·요약과 대조해 가점합니다.
  keywords:
    - "OLED"
    - "display"
    - "thin film transistor"
    - "디스플레이"

  # 이 점수 미만인 결과는 본문 대신 "확인 필요" 섹션으로 분리됩니다.
  # (소속 1건 매칭 = +2점, 키워드 1건 매칭 = +1점)
  match_threshold: 2

scholar:
  # 수집할 최대 논문 수
  max_results: 50

kipris:
  # 수집할 최대 특허 수
  max_results: 100
  # 검색 대상: applicant(출원인) 또는 inventor(발명자)
  search_field: inventor
